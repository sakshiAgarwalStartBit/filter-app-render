# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "001bf18426b6a2900ab7fbf1f7f77c8b"
name = "SB Product Filter Render"
application_url = "https://filter-app-render.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/billing"
  topics = [ "app_subscriptions/update", "shop/update" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_themes,write_metaobject_definitions,write_metaobjects,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://filter-app-render.onrender.com/auth/callback" ]

[app_proxy]
url = "https://filter-app-render.onrender.com/proxy"
subpath = "product-filters"
prefix = "apps"

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "product-updates"
  topic = "Product"
  actions = [ "update" ]
  triggers = [ "product.*" ]
  uri = "https://filter-app-render.onrender.com/webhooks/app/product_update"
